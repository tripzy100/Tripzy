name: Deploy to Vercel

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy-preview:
    name: Deploy Preview (develop / PR)
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_name == 'develop')
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build preview
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to preview
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "preview_url=$url" >> $GITHUB_OUTPUT

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Preview deployed!**\n\n🔗 ${{ steps.deploy.outputs.preview_url }}`
            })

  deploy-production:
    name: Deploy Production (main)
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/tripzy_test"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/tripzy_test"
          NEXT_PUBLIC_SUPABASE_URL: "https://mock.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "mock_anon_key"
          SUPABASE_SERVICE_ROLE_KEY: "mock_service_role_key"
          CLOUDINARY_CLOUD_NAME: "mock_cloudinary"
          CLOUDINARY_API_KEY: "mock_key"
          CLOUDINARY_API_SECRET: "mock_secret"
          GOOGLE_MAPS_API_KEY: "mock_key"
          CASHFREE_APP_ID: "mock_id"
          CASHFREE_SECRET_KEY: "mock_key"
          CASHFREE_ENV: "sandbox"
          RESEND_API_KEY: "re_mock_key"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build production
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        id: deploy-prod
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "prod_url=$url" >> $GITHUB_OUTPUT

      - name: Health check
        continue-on-error: true
        run: |
          echo "Waiting 15s for deployment to stabilize..."
          sleep 15
          TARGET_URL="${{ steps.deploy-prod.outputs.prod_url || vars.PRODUCTION_URL || 'https://tripzy.com' }}"
          STATUS=$(curl -L -o /dev/null -s -w "%{http_code}" "$TARGET_URL" || echo "000")
          echo "Health check response code: $STATUS against $TARGET_URL"

