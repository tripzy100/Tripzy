name: CI — Validate Pull Request

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/tripzy_test"
  DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/tripzy_test"
  NEXT_PUBLIC_SUPABASE_URL: "https://mock.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "mock_anon_key"
  SUPABASE_SERVICE_ROLE_KEY: "mock_service_role_key"
  CLOUDINARY_CLOUD_NAME: "mock_cloudinary"
  CLOUDINARY_API_KEY: "mock_key"
  CLOUDINARY_API_SECRET: "mock_secret"
  GOOGLE_MAPS_API_KEY: "mock_key"
  CASHFREE_APP_ID: "mock_id"
  CASHFREE_SECRET_KEY: "mock_key"
  CASHFREE_ENV: "sandbox"
  RESEND_API_KEY: "re_mock_key"
  NEXT_PUBLIC_APP_URL: "http://localhost:3000"

jobs:
  validate:
    name: Validate Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript compilation
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run unit tests
        run: npm run test

      - name: Build Next.js
        run: npm run build
