name: Tripzy CI Pipeline

on:
  push:
    branches: [main, staging, dev]
  pull_request:
    branches: [main, staging, dev]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Project Dependencies
        run: npm ci

      - name: Validate Lint Standards
        run: npm run lint

      - name: Verify Formatting Style
        run: npm run format:check

      - name: Check TypeScript Compilation
        run: npx tsc --noEmit

      - name: Execute Vitest Unit Tests
        run: npm run test
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/tripzy_test"
          UPSTASH_REDIS_REST_URL: "https://mock.upstash.io"
          UPSTASH_REDIS_REST_TOKEN: "mock_token"
          BETTER_AUTH_SECRET: "mock_secret_longer_than_32_characters_long"
          BETTER_AUTH_URL: "http://localhost:3000"
          CLOUDINARY_CLOUD_NAME: "mock_cloudinary"
          CLOUDINARY_API_KEY: "mock_key"
          CLOUDINARY_API_SECRET: "mock_secret"
          GOOGLE_MAPS_API_KEY: "mock_key"
          CASHFREE_APP_ID: "mock_id"
          CASHFREE_SECRET_KEY: "mock_key"
          CASHFREE_ENV: "sandbox"
          RESEND_API_KEY: "re_mock_key"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
